version: "3.9"

services:
  # =========================
  # DEV
  # =========================

  client-dev:
    profiles: ["dev"]
    build:
      context: ./front
      dockerfile: Dockerfile.dev
    container_name: sentinel-front-dev
    ports:
      - "5173:5173"
    volumes:
      - ./front:/app
      - /app/node_modules
    environment:
      NODE_ENV: development
      HOST: 0.0.0.0
      CHOKIDAR_USEPOLLING: "true"
    networks:
      - sentinel-front

  back-dev:
    profiles: ["dev"]
    build:
      context: ./back
      dockerfile: Dockerfile.dev
    container_name: back-dev
    restart: always
    environment:
      REDIS_URL: redis://redis-dev:6379/0
      ANSIBLE_BASE_DIR: /back/ansible
      ANSIBLE_WORK_DIR: /back/ansible-work
      ANSIBLE_PLAYBOOK_BIN: /usr/bin/ansible-playbook
      ANSIBLE_VAULT_PASSWORD_FILE: /run/secrets/vault_pass
      ANSIBLE_CONFIG: /back/ansible/ansible.cfg
    env_file:
      - ./back/.env
    secrets:
      - vault_pass
    volumes:
      - ./back:/back
      - /back/node_modules
      - ./ansible:/back/ansible:ro
      - ./ansible-work:/back/ansible-work
    ports:
      - "3001:3001"
    depends_on:
      mysql-sentinel:
        condition: service_healthy
      redis-dev:
        condition: service_started
    networks:
      - sentinel-back

  mysql-sentinel:
    profiles: ["dev"]
    image: mysql:8
    container_name: mysql-sentinel
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: sentinel_db
    ports:
      - "3307:3306"
    volumes:
      - mysql-sentinel-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -ppassword --silent"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    networks:
      - sentinel-back

  redis-dev:
    profiles: ["dev"]
    image: redis:7
    container_name: redis-dev
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - sentinel-back

  # =========================
  # PROD - Pour test en local
  # =========================
  client:
    profiles: ["prod"]
    build:
      context: ./front
      dockerfile: Dockerfile
    container_name: sentinel-front-app
    ports:
      - "80:80"
    networks:
      - sentinel-front
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/ || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

  api:
    profiles: ["prod"]
    build:
      context: ./back
      dockerfile: Dockerfile
    container_name: sentinel-back
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL}
    depends_on:
      mysql-prod:
        condition: service_healthy
    ports:
      - "3001:3001"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3001/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - sentinel-back

  mysql-prod:
    profiles: ["prod"]
    image: mysql:8
    container_name: mysql-prod
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      TZ: Europe/Paris
    volumes:
      - mysql-prod-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u${MYSQL_USER} -p${MYSQL_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    networks:
      - sentinel-back

volumes:
  mysql-sentinel-data:
  mysql-prod-data:

networks:
  sentinel-front:
    driver: bridge
  sentinel-back:
    driver: bridge

secrets:
  vault_pass:
    file: ./secrets/vault_pass.txt
